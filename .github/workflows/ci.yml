name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Install lint tooling
        run: python -m pip install ruff==0.16.3
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Smoke test CLI
        run: |
          mcp-permission-linter --version
          mcp-permission-linter examples/secure-mcp.json
          mcp-permission-linter examples/codex-config.toml
          mcp-permission-linter examples/tool-annotations.json
