[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-permission-linter"
version = "0.1.0"
description = "Audit MCP server manifests and tool schemas for least-privilege, secret, and side-effect risks."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Yinghang Wu"}]
keywords = ["mcp", "model-context-protocol", "permissions", "security", "linter", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/yinghang815-create/mcp-permission-linter"
Issues = "https://github.com/yinghang815-create/mcp-permission-linter/issues"

[project.scripts]
mcp-permission-linter = "mcp_permission_linter.cli:main"
mcp-lint = "mcp_permission_linter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_permission_linter"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
